<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="БГ Приключение">
  <meta name="description" content="Забавна игра за учене на български за Саша и Лю">
  
  <title>Българско Приключение 🐻</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-72.svg">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { overscroll-behavior-y: contain; }
    
    .offline-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: linear-gradient(90deg, #f97316, #ea580c);
      color: white; text-align: center; padding: 8px 16px;
      font-weight: 600; z-index: 9999;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      animation: slideDown 0.3s ease-out;
    }
    
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    
    .install-prompt {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      color: white; padding: 16px 20px; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(124, 58, 237, 0.4); z-index: 9998;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      animation: slideUp 0.4s ease-out;
    }
    
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .install-prompt-text { flex: 1; }
    .install-prompt-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
    .install-prompt-subtitle { font-size: 0.9rem; opacity: 0.9; }
    
    .install-btn {
      background: white; color: #7c3aed; border: none; padding: 10px 20px;
      border-radius: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    
    .dismiss-btn {
      background: transparent; border: 2px solid rgba(255, 255, 255, 0.5);
      color: white; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="offline-banner" class="offline-banner" style="display: none;">
    📡 Офлайн режим - играта работи без интернет!
  </div>
  
  <div id="install-prompt" class="install-prompt" style="display: none;">
    <div class="install-prompt-text">
      <div class="install-prompt-title">🐻 Инсталирай играта!</div>
      <div class="install-prompt-subtitle">Играй офлайн на телефон или таблет</div>
    </div>
    <button id="install-btn" class="install-btn">Инсталирай</button>
    <button id="dismiss-btn" class="dismiss-btn">По-късно</button>
  </div>
  
  <div id="root"></div>
  
  <script type="module" src="/src/main.jsx"></script>
  
  <script>
    let deferredPrompt = null;
    const installPromptEl = document.getElementById('install-prompt');
    const installBtn = document.getElementById('install-btn');
    const dismissBtn = document.getElementById('dismiss-btn');
    const offlineBanner = document.getElementById('offline-banner');
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const dismissed = localStorage.getItem('installPromptDismissed');
      if (!dismissed || parseInt(dismissed) < Date.now() - 86400000) {
        installPromptEl.style.display = 'flex';
      }
    });
    
    installBtn?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installPromptEl.style.display = 'none';
      }
    });
    
    dismissBtn?.addEventListener('click', () => {
      localStorage.setItem('installPromptDismissed', Date.now().toString());
      installPromptEl.style.display = 'none';
    });
    
    function updateOnlineStatus() {
      offlineBanner.style.display = navigator.onLine ? 'none' : 'flex';
      document.body.style.paddingTop = navigator.onLine ? '0' : '40px';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
